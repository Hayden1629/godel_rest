<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px -apple-system, sans-serif; width: 260px; padding: 10px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      .row { margin: 4px 0; }
      .ok { color: #1a7f37; }
      .bad { color: #cf222e; }
      .muted { color: #666; }
      code { font-size: 11px; word-break: break-all; }
    </style>
  </head>
  <body>
    <h1>Godel Token Relay</h1>
    <div id="status" class="muted">No token captured yet.</div>
    <div class="row muted" style="margin-top:8px">
      Log in at app.godelterminal.com and interact with the terminal to trigger
      an API call. The token relays automatically.
    </div>
    <script src="popup.js"></script>
  </body>
</html>
